[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Página del servicio: /s/<token>
# La función lee el token de la dirección original, no de parámetros.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/servicio"
  status = 200
  force = true

# Foto para la vista previa de WhatsApp: /i/<token>/<n>
[[redirects]]
  from = "/i/*"
  to = "/.netlify/functions/servicio"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
