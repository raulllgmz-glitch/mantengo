[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Página del servicio: /s/<token>
# La función lee el token de la dirección original, no de parámetros.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/servicio"
  status = 200
  force = true

# Foto para la vista previa de WhatsApp: /i/<token>/<n>
[[redirects]]
  from = "/i/*"
  to = "/.netlify/functions/servicio"
  status = 200
  force = true

# Posición del técnico para el mapa del cliente (JSON): /p/<token>
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/servicio"
  status = 200
  force = true

# Página que abre el técnico para compartir su ubicación: /t/<token>
[[redirects]]
  from = "/t/*"
  to = "/t.html"
  status = 200
  force = true

# App de solicitud de servicios (liga personal del cliente): /n/<código>
[[redirects]]
  from = "/n/*"
  to = "/n.html"
  status = 200
  force = true

# La app de solicitud crea servicios y sube fotos aquí (exige el código del cliente)
[[redirects]]
  from = "/api/solicitud"
  to = "/.netlify/functions/solicitud"
  status = 200
  force = true

# Ruta del día de un cliente: /r/<código>
[[redirects]]
  from = "/r/*"
  to = "/r.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/ruta"
  to = "/.netlify/functions/ruta"
  status = 200
  force = true

# El técnico envía su posición aquí (escribe en Airtable, exige clave)
[[redirects]]
  from = "/api/ubicacion"
  to = "/.netlify/functions/ubicacion"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
